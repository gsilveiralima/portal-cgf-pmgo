name: Validar Portal CGF
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-smoke:
    name: Disponibilidade do runner
    runs-on: ubuntu-latest
    steps:
      - name: Verificar executor
        run: echo "runner-ok"
  tests:
    name: Testes funcionais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar testes
        run: npm test
  audit:
    name: Auditoria visual, segurança e publicação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar auditoria
        run: npm run audit
