name: Validar Portal CGF

on:
  push:
    branches:
      - main
      - 'p0-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-cgf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, auditoria, sintaxe e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências reproduzivelmente
        run: npm ci
      - name: Executar testes e auditoria
        run: npm run check
      - name: Auditar dependências
        run: npm audit --audit-level=high
      - name: Validar sintaxe dos módulos críticos
        run: |
          node --check api/assistant.js
          node --check api/news.js
          node --check api/orientar.js
          node --check api/search.js
          node --check assistant.js
          node --check work-patches.js
